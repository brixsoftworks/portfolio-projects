services:
  quacko:
    build: .
    image: quacko:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 16 chars) in .env}
      DATA_DIR: /data
      WEB_DIR: /app/web
      PUBLIC_URL: ${PUBLIC_URL:-}
      TIMEZONE: ${TIMEZONE:-UTC}
      # Optional LLM coach. Leave unset to use the deterministic demo coach.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - quacko-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Optional automatic HTTPS via Caddy. Enable with `DOMAIN=quacko.example.com docker compose --profile tls up -d`.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - quacko
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to enable the tls profile}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  quacko-data:
  caddy-data:
  caddy-config: