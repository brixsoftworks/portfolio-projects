# ============================================================================
# Strict Day - Supabase project config (supabase CLI)
# Used by: supabase start / supabase functions serve / supabase db push
# ============================================================================
project_id = "strictday"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://strictday.app"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions]
enabled = true
verify_jwt = true
# verify-task evaluates rules server-side; keep JWT verification ON so the
# function can trust the authenticated caller.

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[analytics]
enabled = false

[realtime]
enabled = true