
<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<style>
  body { margin: 0; background: #efece6; }
  .spacer { height: 600px; }
  .card {
    position: relative;
    width: 360px;
    height: 540px;
    margin: 50px auto;
    overflow: hidden;
    border: 2px solid #ccc;
  }
  .sketch {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .real {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    -webkit-mask-image: url('/images/pixel-wipe-down.svg');
    mask-image: url('/images/pixel-wipe-down.svg');
    -webkit-mask-size: 100% 3000%;
    mask-size: 100% 3000%;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: 0% 0%;
    mask-position: 0% 0%;
    will-change: mask-position, -webkit-mask-position;
  }
</style>
</head>
<body>
  <div class="spacer"></div>
  <div class="card"><img class="sketch" src="/images/bed-sketch.webp"><img class="real" src="/images/bed-real.jpg"></div>
  <div class="spacer"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);
    const realImg = document.querySelector('.real');
    gsap.to(realImg, {
      maskPosition: '0% 100%',
      webkitMaskPosition: '0% 100%',
      ease: 'steps(29)',
      scrollTrigger: {
        trigger: '.card',
        start: 'top 80%',
        end: 'bottom 20%',
        scrub: 0.6
      }
    });
  </script>
</body>
</html>
