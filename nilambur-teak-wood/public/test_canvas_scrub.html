<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canvas Frame Scrub Test</title>
  <style>
    body, html { margin: 0; padding: 0; background: #0d0c0a; height: 100%; overflow-x: hidden; }
    .spacer-top { height: 100vh; background: #e9e2d4; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
    .pin-wrap { height: 100vh; width: 100vw; position: relative; overflow: hidden; }
    canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
    .spacer-bottom { height: 100vh; background: #e9e2d4; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
</head>
<body>
  <div class="spacer-top">Scroll Down to Enter Rolls-Royce Section</div>
  <div class="pin-wrap" id="pinSection">
    <canvas id="heroCanvas"></canvas>
  </div>
  <div class="spacer-bottom">Next Content</div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const canvas = document.getElementById('heroCanvas');
    const ctx = canvas.getContext('2d');
    const frameCount = 240;
    const currentFrame = (idx) => `/rr_frames_webp/f_${String(idx + 1).padStart(4, '0')}.webp`;

    const images = [];
    let loadedCount = 0;

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    function drawImageCover(img) {
      if (!img || !img.complete) return;
      const cw = canvas.width;
      const ch = canvas.height;
      const iw = img.naturalWidth || 1920;
      const ih = img.naturalHeight || 1080;
      const hRatio = cw / iw;
      const vRatio = ch / ih;
      const ratio = Math.max(hRatio, vRatio);
      const nw = iw * ratio;
      const nh = ih * ratio;
      const cx = (cw - nw) / 2;
      const cy = (ch - nh) / 2;
      ctx.clearRect(0, 0, cw, ch);
      ctx.drawImage(img, cx, cy, nw, nh);
    }

    // Preload first frame immediately
    const firstImg = new Image();
    firstImg.src = currentFrame(0);
    firstImg.onload = () => {
      drawImageCover(firstImg);
    };

    // Preload all frames
    for (let i = 0; i < frameCount; i++) {
      const img = new Image();
      img.src = currentFrame(i);
      img.onload = () => {
        loadedCount++;
      };
      images.push(img);
    }

    const state = { frame: 0 };
    gsap.to(state, {
      frame: frameCount - 1,
      snap: 'frame',
      ease: 'none',
      scrollTrigger: {
        trigger: '#pinSection',
        start: 'top top',
        end: '+=2500',
        pin: true,
        scrub: 0.15,
        onUpdate: (self) => {
          const idx = Math.min(frameCount - 1, Math.max(0, Math.round(self.progress * (frameCount - 1))));
          const targetImg = images[idx];
          if (targetImg && targetImg.complete) {
            drawImageCover(targetImg);
          }
        }
      }
    });
  </script>
</body>
</html>
